  name: Job_API

  on:
    push:
      branches: [main, feature-stationary]
    pull_request:
      branches: [main]
    schedule:
    - cron: '0 9 * * *'

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        -  name: Code checkout
           uses: actions/checkout@v4

        -  name: Python setup
           uses: actions/setup-python@v5
           with:
            python-version: '3.11'

        -  name: Install all dependencies
           run: pip install -r requirements.txt

        -  name: Compile check
           run: python -m py_compile job_status.py

        -  name: Authenticate to google cloud
           env:
            GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
           run: |
            echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-key.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

        -  name: Run Job Postings Pipeline
           env:
              GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
              BQ_DATASET: ${{ secrets.BQ_DATASET }}
              BQ_TABLE: ${{ secrets.BQ_TABLE }}
              GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
           run: python job_status.py
          

        - name: Lint with flake8
          run: flake8 Job_status.py --max-line-length=100 --exit-zero
        
